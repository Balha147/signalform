<div class="space-y-4 lg:sticky lg:top-6">
    <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-xl border border-slate-800 space-y-6">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Quotation Summary</h3>

        <div class="space-y-3 text-sm">
            <div class="flex justify-between text-slate-400">
                <span>Sub-Total HT</span>
                <span class="font-medium text-white">{{ subtotalHT() | currency:'EUR' }}</span>
            </div>
            <div class="flex justify-between text-slate-400">
                <span>TVA ({{ tvaRatePercent() }}%)</span>
                <span class="font-medium text-white">{{ tvaAmount() | currency:'EUR' }}</span>
            </div>

            <div class="h-px bg-slate-800 my-4"></div>

            <div class="flex justify-between items-baseline">
                <span class="text-base font-bold">TOTAL TTC</span>
                <span class="text-xl font-black text-blue-400">{{ totalTTC() | currency:'EUR' }}</span>
            </div>
        </div>

        <button type="button" (click)="onGeneratePdf()" [disabled]="isGeneratingPdf()"
            class="w-full mt-2 flex items-center justify-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 transform active:scale-98 transition-all duration-200 ease-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-slate-900 group disabled:opacity-60 disabled:cursor-not-allowed">
            @if (isGeneratingPdf()) {
            <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" stroke-opacity="0.25" />
                <path d="M12 2a10 10 0 0 1 10 10" />
            </svg>
            <span>Génération...</span>
            } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                stroke="currentColor"
                class="w-5 h-5 text-blue-200 group-hover:text-white transition-colors duration-200">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            <span>Generate PDF</span>
            }
        </button>
    </div>
</div>
