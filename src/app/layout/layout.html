<div class="min-h-screen bg-slate-50 flex">

    <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-slate-200 border-r border-slate-800 shrink-0">
        <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-800">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg text-lg font-bold">📈</div>
            <span class="font-bold text-lg tracking-tight text-white">Dealflow</span>
        </div>

        <nav class="flex-1 p-4 space-y-1.5">
            <a routerLink="/home" routerLinkActive="bg-blue-600 text-white"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 transition-colors font-medium group">
                <span class="text-xl" aria-hidden="true">🏠</span> Dashboard
            </a>
            <a routerLink="/quotes/create" routerLinkActive="bg-blue-600 text-white"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 transition-colors font-medium group">
                <span class="text-xl" aria-hidden="true">📄</span> Create a Quote
            </a>
            <a routerLink="/clients" routerLinkActive="bg-blue-600 text-white"
                class="flex items-center gap-3 px-4 py-2.5 rounded-xl hover:bg-slate-800 transition-colors font-medium group">
                <span class="text-xl" aria-hidden="true">👥</span> Clients
            </a>

        </nav>

        <div class="p-4 border-t border-slate-800 flex items-center gap-3">
            <div
                class="w-9 h-9 bg-slate-700 rounded-full flex items-center justify-center font-bold text-sm text-white">
                HB
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-white truncate">Hedi Basly</p>
                <p class="text-xs text-slate-400 truncate">Angular Developer</p>
            </div>
        </div>
    </aside>

    @if(isMobileMenuOpen()) {
    <div class="md:hidden fixed inset-0 z-50 flex">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" (click)="toggleMobileMenu()"></div>

        <aside class="relative flex flex-col w-64 bg-slate-900 text-slate-200 h-full p-4 space-y-4 shadow-xl">
            <div class="flex justify-between items-center pb-4 border-b border-slate-800">
                <span class="font-bold text-white">Menu</span>
                <button (click)="toggleMobileMenu()" class="text-2xl p-1 text-slate-400 hover:text-white">✕</button>
            </div>
            <nav class="space-y-1">
                <a routerLink="/home" (click)="toggleMobileMenu()"
                    class="block px-4 py-2.5 rounded-xl hover:bg-slate-800 font-medium">🏠 Dashboard</a>
                <a routerLink="/quotes/create" (click)="toggleMobileMenu()"
                    class="block px-4 py-2.5 rounded-xl hover:bg-slate-800 font-medium">📄 Create a Quote</a>
                <a routerLink="/clients" (click)="toggleMobileMenu()"
                    class="block px-4 py-2.5 rounded-xl hover:bg-slate-800 font-medium">👥 Clients</a>
            </nav>
        </aside>
    </div>
    }


    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-8 shrink-0">
            <button (click)="toggleMobileMenu()" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                ☰
            </button>

            <div class="flex items-center gap-4 ml-auto">
                <span class="text-sm font-semibold text-slate-700 hidden sm:inline">Hedi Basly</span>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <router-outlet></router-outlet>
        </main>

    </div>
</div>
