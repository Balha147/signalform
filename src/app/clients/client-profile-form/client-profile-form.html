<form (submit)="onFormSubmit($event)" novalidate autocomplete="off" class="p-6 sm:p-8 space-y-6">

    <div>
        <h3 class="text-xl font-extrabold tracking-tight text-slate-900">
            New client
        </h3>
        <p class="text-xs text-slate-500 mt-1">Provide the legal entity information.</p>
    </div>

    <hr class="border-slate-100" />

    <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Company name</label>
        <input type="text" [formField]="clientForm.companyName" placeholder="Ex: Acme Corp"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all duration-200"
            [ngClass]="{
        'border-rose-500 bg-rose-50/30 focus:ring-rose-500/10 focus:border-rose-500': clientForm.companyName().errors()?.length && clientForm.companyName().touched(),
        'border-emerald-500 bg-emerald-50/30 focus:ring-emerald-500/10 focus:border-emerald-500': !clientForm.companyName().errors()?.length && clientForm.companyName().value() && clientForm.companyName().touched()
      }" />
        <app-field-feedback [errors]="clientForm.companyName().errors()" [touched]="clientForm.companyName().touched()"
            [value]="clientForm.companyName().value" />
    </div>

    <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Name of contact</label>
        <input type="text" [formField]="clientForm.contactName" placeholder="Ex: Jean Dupont"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all duration-200"
            [ngClass]="{
        'border-rose-500 bg-rose-50/30 focus:ring-rose-500/10 focus:border-rose-500': clientForm.contactName().errors()?.length && clientForm.contactName().touched(),
        'border-emerald-500 bg-emerald-50/30 focus:ring-emerald-500/10 focus:border-emerald-500': !clientForm.contactName().errors()?.length && clientForm.contactName().value() && clientForm.contactName().touched()
      }" />
        <app-field-feedback [errors]="clientForm.contactName().errors()" [touched]="clientForm.contactName().touched()"
            [value]="clientForm.contactName().value" />
    </div>

    <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Channel</label>
        <div class="relative">
            <select [formField]="clientForm.preferredContact"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all appearance-none cursor-pointer">
                <option value="both">Email and phone</option>
                <option value="email">Email only</option>
                <option value="phone">Phone only</option>
            </select>
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs">▼</span>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
                <span>Email</span>
                @if (clientForm.preferredContact().value() === 'phone') {
                <span class="text-[10px] font-normal normal-case text-slate-400">(optionnel)</span>
                }
            </label>
            <input type="email" [formField]="clientForm.email" placeholder="nom@entreprise.com"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all duration-200"
                [ngClass]="{
          'border-rose-500 bg-rose-50/30 focus:ring-rose-500/10 focus:border-rose-500': clientForm.email().errors()?.length && clientForm.email().touched(),
          'border-emerald-500 bg-emerald-50/30 focus:ring-emerald-500/10 focus:border-emerald-500': !clientForm.email().errors()?.length && clientForm.email().value() && clientForm.email().touched()
        }" />
            <app-field-feedback [errors]="clientForm.email().errors()" [touched]="clientForm.email().touched()"
                [value]="clientForm.email().value" />
        </div>

        <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-600 flex items-center justify-between">
                <span>Phone</span>
                @if (clientForm.preferredContact().value() === 'email') {
                <span class="text-[10px] font-normal normal-case text-slate-400">(optionnel)</span>
                }
            </label>
            <input type="tel" [formField]="clientForm.phone" placeholder="06 00 00 00 00"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all duration-200"
                [ngClass]="{
          'border-rose-500 bg-rose-50/30 focus:ring-rose-500/10 focus:border-rose-500': clientForm.phone().errors()?.length && clientForm.phone().touched(),
          'border-emerald-500 bg-emerald-50/30 focus:ring-emerald-500/10 focus:border-emerald-500': !clientForm.phone().errors()?.length && clientForm.phone().value() && clientForm.phone().touched()
        }" />
            <app-field-feedback [errors]="clientForm.phone().errors()" [touched]="clientForm.phone().touched()"
                [value]="clientForm.phone().value" />
        </div>
    </div>

    <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-600">Address</label>
        <input type="text" [formField]="clientForm.address" placeholder="12 rue de la Paix, Paris"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all duration-200"
            [ngClass]="{
        'border-rose-500 bg-rose-50/30 focus:ring-rose-500/10 focus:border-rose-500': clientForm.address().errors()?.length && clientForm.address().touched(),
        'border-emerald-500 bg-emerald-50/30 focus:ring-emerald-500/10 focus:border-emerald-500': !clientForm.address().errors()?.length && clientForm.address().value() && clientForm.address().touched()
      }" />
        <app-field-feedback [errors]="clientForm.address().errors()" [touched]="clientForm.address().touched()"
            [value]="clientForm.address().value" />
    </div>

    <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-600">SIRET</label>
        <input type="text" [formField]="clientForm.siret" placeholder="14 chiffres requis"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 text-sm font-mono text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all duration-200"
            [ngClass]="{
        'border-rose-500 bg-rose-50/30 focus:ring-rose-500/10 focus:border-rose-500': clientForm.siret().errors()?.length && clientForm.siret().touched(),
        'border-emerald-500 bg-emerald-50/30 focus:ring-emerald-500/10 focus:border-emerald-500': !clientForm.siret().errors()?.length && clientForm.siret().value() && clientForm.siret().touched()
      }" />
        <app-field-feedback [errors]="clientForm.siret().errors()" [touched]="clientForm.siret().touched()"
            [value]="clientForm.siret().value" />
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="onCancel()"
            class="px-5 py-2.5 text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-100/80 rounded-xl transition-all duration-200">
            Cancel
        </button>
        <button type="submit" [disabled]="clientForm().submitting()"
            class="px-5 py-2.5 text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 disabled:cursor-not-allowed rounded-xl shadow-sm transition-all duration-200">
            Add client
        </button>
    </div>

</form>
