@if (hasError()) {
<p class="text-xs font-medium text-rose-600 flex items-center gap-1">
    @if (showIcon()) { ⚠️ }
    {{ errorMessage() }}
</p>
} @else if (isValid()) {
<p class="text-xs font-semibold text-emerald-600 flex items-center gap-1">
    @if (showIcon()) { ✓ }
    {{ validMessage() }}
</p>
}
